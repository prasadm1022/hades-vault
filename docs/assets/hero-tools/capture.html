<!doctype html><meta charset="utf-8"><body style="margin:0;background:#0d1117"><canvas id="c" width="1280" height="640" style="width:100%"></canvas><script>
const q=new URLSearchParams(location.search);
const FPS=+(q.get('fps')||12), FADE=+(q.get('fade')||0.6), QUAL=+(q.get('q')||0.72), SCALE=+(q.get('scale')||1);
const OX=+(q.get('ox')||150), OY=+(q.get('oy')||-50); // where the video's top-left lands on the banner
const W=1280*SCALE,H=640*SCALE;
const c=document.getElementById('c');c.width=W;c.height=H;const g=c.getContext('2d');
const mk=async(url)=>{const v=document.createElement('video');v.muted=true;v.src=url;await new Promise(r=>v.onloadeddata=r);return v};
const seek=(v,t)=>new Promise(r=>{v.onseeked=()=>r();v.currentTime=Math.min(t,v.duration-0.001)});
const off=document.createElement('canvas');off.width=W;off.height=H;const og=off.getContext('2d');
function drawVideo(ctx,v){ctx.save();ctx.scale(SCALE,SCALE);ctx.fillStyle='#020b1f';ctx.fillRect(0,0,1280,640);ctx.drawImage(v,OX,OY,1280,720);
  // blend the video's left edge into the background so the text area is clean
  const gr=ctx.createLinearGradient(OX,0,OX+260,0);gr.addColorStop(0,'rgba(2,11,31,1)');gr.addColorStop(1,'rgba(2,11,31,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,OX+260,640);ctx.restore()}
function drawText(ctx){ctx.save();ctx.scale(SCALE,SCALE);
  const tg=ctx.createLinearGradient(60,0,520,0);tg.addColorStop(0,'#67e8f9');tg.addColorStop(.55,'#38bdf8');tg.addColorStop(1,'#818cf8');
  ctx.fillStyle=tg;ctx.font='800 112px "Segoe UI",Inter,Helvetica,Arial,sans-serif';ctx.letterSpacing='10px';ctx.shadowColor='rgba(56,189,248,.45)';ctx.shadowBlur=24;ctx.fillText('HADES',62,268);
  ctx.shadowBlur=0;ctx.letterSpacing='0px';ctx.fillStyle='#e2e8f0';ctx.font='600 30px "Segoe UI",Inter,Helvetica,Arial,sans-serif';ctx.fillText('The autonomous AI software company',66,322);
  ctx.fillStyle='#94a3b8';ctx.font='21px "Segoe UI",Inter,Helvetica,Arial,sans-serif';ctx.fillText('Requirements in. Tested, security-scanned commits out.',66,372);ctx.fillText('11 AI role agents, one pipeline, zero pushes without you.',66,402);
  ctx.fillStyle='#64748b';ctx.font='15px "Segoe UI",Inter,Helvetica,Arial,sans-serif';ctx.letterSpacing='1.5px';ctx.fillText('CLAUDE CODE · CODEX · CURSOR · GEMINI CLI · COPILOT · MIT',66,466);
  ctx.letterSpacing='0px';ctx.font='600 19px "Segoe UI",Inter,Helvetica,Arial,sans-serif';ctx.fillStyle='#94a3b8';ctx.fillText('A project by ',66,512);ctx.fillStyle='#67e8f9';ctx.fillText('HadesVault.com',66+ctx.measureText('A project by ').width,512);ctx.restore()}
(async()=>{const url=URL.createObjectURL(await (await fetch('in.mp4')).blob());const a=await mk(url),b=await mk(url);
  const D=a.duration, L=D-FADE;
  async function frame(t){await seek(a,t);drawVideo(g,a);
    if(t<FADE){await seek(b,t+L);drawVideo(og,b);g.save();g.globalAlpha=1-t/FADE;g.drawImage(off,0,0);g.restore()}
    drawText(g)}
  if(q.has('preview')){await frame(+q.get('preview'));document.title='preview';return}
  const n=Math.floor(L*FPS);let bytes=0;
  for(let i=0;i<n;i++){await frame(i/FPS);const blob=await new Promise(r=>c.toBlob(r,'image/webp',QUAL));bytes+=blob.size;
    await fetch('/frame/'+String(i).padStart(4,'0')+'.webp',{method:'POST',body:blob});document.title='frame '+i+'/'+n+' '+(bytes/1048576).toFixed(2)+'MB'}
  await fetch('/meta.json',{method:'POST',body:JSON.stringify({n,fps:FPS,w:W,h:H,bytes})});document.title='done '+n+' '+(bytes/1048576).toFixed(2)+'MB'})();
</script></body>
